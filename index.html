<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS – תזרים ופרויקטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --navy:#14213d; --navy2:#1f3160; --gold:#c9a227; --gold-soft:#f6ecc8;
  --lav:#eceafd; --lav2:#d9d5f7; --bg:#f3f4f8; --card:#fff; --line:#dfe2ea;
  --text:#1b2233; --muted:#6b7385; --red:#c62828; --red-bg:#fde8e8;
  --green:#1e7d3a; --green-bg:#e3f5e8; --blue:#1d5fbf; --edit:#fffbea; --auto:#f4f6fb;
  --warn:#b26a00; --warn-bg:#fff3dc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;right:0;left:0;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#topbar .brand{font-weight:800;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#topbar .brand small{font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.pill-gold{background:var(--gold);color:var(--navy);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
.tb-stat{font-size:12px;opacity:.9;white-space:nowrap}
.tb-stat b{font-size:14px}
#searchBox{flex:1;max-width:340px;position:relative}
#searchBox input{width:100%;border-radius:999px;border:0;padding:7px 14px;background:#2b3d6b;color:#fff}
#searchBox input::placeholder{color:#b9c2dc}
#searchResults{position:absolute;top:38px;right:0;left:0;background:#fff;color:var(--text);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-height:360px;overflow:auto;z-index:60}
#searchResults div{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#searchResults div:hover{background:var(--lav)}
.tb-spacer{flex:1}
.tb-btn{background:#2b3d6b;color:#fff;border:0;border-radius:8px;padding:7px 11px;white-space:nowrap}
.tb-btn:hover{background:#3a4f86}
.tb-btn.gold{background:var(--gold);color:var(--navy);font-weight:700}
#saveState{font-size:12px;white-space:nowrap}
#saveState.dirty{color:#ffd37a}#saveState.ok{color:#8fe3a6}#saveState.err{color:#ff9a9a}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;margin-inline-start:4px}

/* ---------- sidebar ---------- */
#sidebar{position:fixed;top:56px;right:0;bottom:0;width:236px;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:10px 8px 80px;z-index:40}
.sb-item,.sb-group-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none}
.sb-item:hover,.sb-group-h:hover{background:var(--lav)}
.sb-item.active{background:var(--navy);color:#fff}
.sb-group-h{font-weight:700;margin-top:6px}
.sb-group-h .chev{display:inline-block;transition:transform .15s;font-size:11px;width:12px}
.sb-group.closed .chev{transform:rotate(90deg)}
.sb-group.closed .sb-children{display:none}
.sb-children{padding-right:14px}
.sb-children .sb-item{font-size:13px;padding:6px 10px}
.sb-count{margin-inline-start:auto;font-size:11px;color:var(--muted);background:var(--bg);border-radius:9px;padding:0 6px}
.sb-item.active .sb-count{background:#2b3d6b;color:#fff}
.sb-empty{font-size:12px;color:var(--muted);padding:4px 12px}
#btnNew{display:block;width:100%;margin:6px 0 10px;background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:10px;font-weight:800;font-size:14px}
.sb-client{margin:0}
.sb-group-h.sb-client-h{font-weight:600;font-size:13.5px;margin-top:2px;padding:6px 10px;color:#2a3450}
.sb-client-h .sb-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-client .sb-children{padding-right:16px;border-right:1px dashed #d9dde8;margin-right:14px}
.sb-group.closed > .sb-group-h .chev{transform:rotate(90deg)}
.sb-group:not(.closed) > .sb-group-h .chev{transform:none}
.sb-sep{border-top:1px solid var(--line);margin:10px 4px}

/* ---------- main ---------- */
#main{margin:56px 236px 0 0;padding:16px 18px 40px;min-height:calc(100vh - 56px)}
.crumb{background:var(--lav);border:1px solid var(--lav2);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.crumb h2{margin:0;font-size:18px}
.crumb .meta{font-size:12px;color:var(--muted)}
.crumb .grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--navy2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.danger{color:var(--red);border-color:#f0b9b9}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:3px 8px;font-size:12px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:10px;padding:8px 14px;min-width:130px}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:700;direction:ltr;text-align:right}
.stat.green{border-top-color:var(--green)}.stat.red{border-top-color:var(--red)}.stat.gold{border-top-color:var(--gold)}
.filter-note{font-size:12px;color:var(--blue);margin-bottom:6px}
.layout-side{display:flex;gap:12px;align-items:flex-start}
.layout-side .main-col{flex:1;min-width:0}
.side-panel{width:220px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;flex-shrink:0;position:sticky;top:70px}
.side-panel h4{margin:0 0 8px;font-size:14px}
.side-panel table{width:100%;border-collapse:collapse;font-size:13px}
.side-panel td{padding:4px;border-bottom:1px solid var(--line)}
.side-panel td:last-child{text-align:left;direction:ltr}

/* ---------- messages ---------- */
#msgArea{margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.msg{border-radius:8px;padding:7px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d49b}
.msg.err{background:var(--red-bg);color:var(--red);border:1px solid #f0b9b9}
.msg.info{background:#e7f0fd;color:var(--blue);border:1px solid #c3d8f7}
#toasts{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:420px;font-size:13px}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--warn)}

/* ---------- grid ---------- */
.grid-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 290px)}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.grid th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:500;font-size:12px;padding:6px 6px;border-left:1px solid #2b3d6b;white-space:nowrap;z-index:2;text-align:right}
.grid th .fbtn{background:transparent;border:0;color:#aeb8d6;padding:0 3px;font-size:11px}
.grid th .fbtn.on{color:var(--gold)}
.grid th.num{text-align:left}
.grid td{border-bottom:1px solid var(--line);border-left:1px solid #eef0f5;padding:2px 4px;vertical-align:middle;white-space:nowrap;font-size:13px}
.grid tr:hover td{background:#fafbff}
.grid tr.flash td{animation:flash 2s}
@keyframes flash{0%,40%{background:var(--gold-soft)}100%{background:transparent}}
.grid td.auto{background:var(--auto)}
.grid td.num{text-align:left;direction:ltr}
.grid input.cell,.grid select.cell{border:1px solid #d7dbe6;border-radius:5px;background:var(--edit);padding:3px 5px;width:100%;min-width:60px}
.grid input.cell:focus,.grid select.cell:focus{outline:2px solid var(--gold);background:#fff}
.grid input.cell.num{text-align:left;direction:ltr}
.grid input.cell.w-s{min-width:48px;width:56px}
.grid input.cell.w-y{min-width:66px;width:70px}
.grid select.cell.w-t{min-width:74px;width:78px}
.grid select.cell.w-s{min-width:58px;width:62px}
.grid input.cell.w-m{min-width:80px;width:90px}
.grid input.cell.w-l{min-width:150px;width:180px}
.grid td.sticky-r{position:sticky;right:0;background:#fff;z-index:1}
.grid th.sticky-r{right:0;z-index:3}
.computed{direction:ltr;display:inline-block;min-width:70px;text-align:left}
.ovr{background:#fff0c2;border-radius:4px;padding:0 3px}
.ovr-mark{color:var(--warn);font-size:11px;cursor:pointer;margin-inline-start:3px}
.muted{color:var(--muted)}
.fc{font-style:italic;color:var(--muted)}
.red{color:var(--red)!important;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid #b9c6e6;background:#eef3ff;color:var(--blue);border-radius:6px;padding:1px 6px;cursor:pointer;direction:ltr}
.chip.linked{background:#e3f5e8;border-color:#9fd3ae;color:var(--green)}
.chip.zero{background:var(--red-bg);border-color:#f0b9b9;color:var(--red);font-weight:700}
.chip .ed{color:var(--muted);font-size:11px;padding-left:2px}
.status{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.status.no{background:var(--red-bg);color:var(--red)}
.status.yes{background:var(--green-bg);color:var(--green)}
.status.fc{background:#eef0f5;color:var(--muted);font-style:normal}
.row-del{border:0;background:transparent;color:#b8bdc9;font-size:15px;padding:0 4px}
.row-del:hover{color:var(--red)}
.term-wrap{display:flex;flex-direction:column;gap:2px}
.term-wrap small{font-size:11px;color:var(--muted);direction:ltr;text-align:right}
.tot-row td{background:var(--gold-soft)!important;font-weight:700;position:sticky;bottom:0}

/* ---------- date picker ---------- */
.dp{display:inline-flex;align-items:center;gap:2px}
.dp input{width:92px!important;min-width:92px!important;direction:ltr;text-align:center}
.dp button{border:0;background:transparent;padding:0 2px;font-size:14px}
#dpPop{position:fixed;background:#fff;border:1px solid #e3e6ec;border-radius:12px;box-shadow:0 10px 30px rgba(20,33,61,.18);padding:12px 12px 10px;z-index:300;width:300px;font-family:inherit}
#dpPop .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#dpPop .hd select{flex:1;height:34px;border:1px solid #d9dde4;border-radius:7px;padding:0 8px;background:#fff;font-size:14px;color:#1b2233}
#dpPop .hd .nav{flex:0 0 34px;width:34px;height:34px;border:1px solid #d9dde4;background:#fff;border-radius:7px;font-size:18px;line-height:1;color:#6b7385;padding:0}
#dpPop .hd .nav.prev{color:var(--red)}
#dpPop .hd .nav:hover:not(:disabled){background:#f4f5f9}
#dpPop .hd .nav:disabled{opacity:.35;cursor:default}
#dpPop table{width:100%;border-collapse:collapse;text-align:center;table-layout:fixed}
#dpPop th{font-size:12px;color:#8a92a3;font-weight:400;padding:4px 0 8px}
#dpPop td{padding:2px 0}
#dpPop td button{width:36px;height:34px;border:2px solid transparent;border-radius:7px;background:transparent;font-size:14px;color:#1b2233}
#dpPop td button:hover{background:#eef0f6}
#dpPop td button.inmonth{background:#eef1f8}
#dpPop td button.sel{background:var(--navy2);color:#fff;font-weight:700}
#dpPop td button.today{background:var(--navy2);color:#fff;font-weight:700;border-color:var(--red)}
#dpPop .ft{display:flex;justify-content:space-between;margin-top:10px}
#dpPop .fbt{height:32px;padding:0 14px;border:1px solid #d9dde4;border-radius:7px;background:#fff;color:#1b2233;font-size:13.5px}
#dpPop .fbt:hover{background:#f4f5f9}

/* ---------- filter popup ---------- */
#fPop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:8px;z-index:300;width:220px}
#fPop input[type=text]{width:100%;margin-bottom:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
#fPop .list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px}
#fPop label{display:flex;gap:6px;align-items:center;padding:2px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fPop .ft{display:flex;gap:4px;justify-content:space-between;margin-top:6px}

/* ---------- drop zone ---------- */
.docbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:12px}
.dropzone{flex:1;min-width:260px;border:2px dashed #9aa6c6;border-radius:12px;background:#fafbff;padding:14px;text-align:center;color:var(--muted)}
.dropzone.over{background:var(--lav);border-color:var(--navy2);color:var(--navy)}
.docpath{flex:1;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.docpath label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.docpath .r{display:flex;gap:6px}
.docpath input{flex:1;direction:ltr;padding:6px;border:1px solid var(--line);border-radius:6px}
.doclist{font-size:12px;margin-top:6px;max-height:110px;overflow:auto;text-align:right}
.doclist div{padding:2px 0;border-bottom:1px dashed var(--line)}

/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:rgba(15,22,40,.5);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:1100px}
.modal .mh{background:var(--navy);color:#fff;padding:12px 16px;font-weight:700;font-size:16px;display:flex;align-items:center;border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
.modal .mh .x{margin-inline-start:auto;background:transparent;border:0;color:#fff;font-size:20px}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;position:sticky;bottom:0;background:#fff}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-weight:500;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.form-row .hint{font-size:12px;color:var(--muted);margin-top:3px}
.type-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.type-card{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:center}
.type-card b{display:block;font-size:15px;margin-bottom:4px}
.type-card span{font-size:12px;color:var(--muted)}
.type-card.sel{border-color:var(--gold);background:var(--gold-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
table.simple{border-collapse:collapse;width:100%;font-size:13px}
table.simple th,table.simple td{border:1px solid var(--line);padding:5px 7px;text-align:right}
table.simple th{background:var(--lav)}
table.simple td.num{direction:ltr;text-align:left}
.setting-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.setting-card h3{margin:0 0 10px;font-size:15px}
.setting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.empty-state{background:#fff;border:1px dashed #b9c0d3;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
.empty-state b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.an-card{background:#fff;border:1px solid var(--line);border-right:4px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.an-card.s-exception{border-right-color:var(--green)}
.an-card.s-fix{border-right-color:var(--blue)}
.an-card .kv{margin:6px 0}
.indent td:nth-child(3){padding-right:22px}
/* ---------- new project modal (לפי העיצוב) ---------- */
.modal.np-modal{max-width:640px;border-radius:12px;padding:22px 20px 18px;background:#fff}
.np-title{font-size:17px;font-weight:700;color:#1b1f23;margin-bottom:18px}
.np-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.np-card{border:1.5px solid #d4d8dd;border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.np-card:hover{border-color:#9fb3a8}
.np-card b{display:block;font-size:14.5px;color:#1b1f23;margin-bottom:6px}
.np-card span{display:block;font-size:12.5px;color:#6b7280;line-height:1.55}
.np-card.sel{border:2px solid #3f6b58;background:#e6f0ea}
.np-grid{display:grid;grid-template-columns:175px 1fr;gap:12px 14px;align-items:center}
.np-grid label{font-size:13.5px;color:#1f2937;white-space:nowrap}
.np-grid input{width:100%;height:30px;border:1px solid #d4d8dd;border-radius:5px;padding:4px 8px;font-size:13px;background:#fff}
.np-grid input:focus{outline:none;border-color:#3f6b58;box-shadow:0 0 0 2px rgba(63,107,88,.15)}
.np-grid input::placeholder{color:#9aa1ab}
.np-grid input.np-short{width:150px}
.np-actions{display:flex;gap:10px;margin-top:22px}
.np-btn{height:34px;padding:0 16px;border-radius:6px;border:1px solid #cfd4da;background:#fff;color:#1f2937;font-size:13.5px}
.np-btn:hover{background:#f3f4f6}
.np-btn.np-primary{background:#1e2a28;border-color:#1e2a28;color:#fff;font-weight:600}
.np-btn.np-primary:hover{background:#2c3b38}
.modal .np-grid{margin-top:4px}
.sb-add{margin-inline-start:4px;border:0;background:var(--gold-soft);color:var(--navy);border-radius:6px;width:22px;height:20px;line-height:1;font-weight:700;padding:0}
.sb-add:hover{background:var(--gold)}
@media (max-width:600px){.np-cards{grid-template-columns:1fr}.np-grid{grid-template-columns:1fr}.np-grid input.np-short{width:100%}}
.grid td.nosup{background:repeating-linear-gradient(135deg,#f6f7fa,#f6f7fa 6px,#eef0f4 6px,#eef0f4 12px);color:#b3b9c6;text-align:center}
.doctarget{font-size:12.5px;margin-top:6px;padding:6px 8px;border-radius:6px;line-height:1.6}
.doctarget.ok{background:var(--green-bg);color:var(--green)}
.doctarget.warn{background:var(--warn-bg);color:var(--warn)}
.doctarget .hint{font-size:11.5px;color:var(--muted)}
.period-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.period-bar .seg{display:inline-flex;border:1px solid var(--navy);border-radius:8px;overflow:hidden}
.period-bar .seg button{border:0;background:#fff;color:var(--navy);padding:6px 14px;font-weight:500}
.period-bar .seg button+button{border-right:1px solid var(--navy)}
.period-bar .seg button.on{background:var(--navy);color:#fff}
.period-bar .pnav{display:inline-flex;align-items:center;gap:6px}
.period-bar .pbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:30px;height:30px;color:var(--navy);font-size:11px}
.period-bar .pbtn:hover{background:var(--lav)}
.period-pill{font-size:15px;padding:5px 16px;min-width:92px;text-align:center;direction:ltr;border:0;cursor:pointer;font-family:inherit}
.period-pill:hover{filter:brightness(1.06)}
.period-bar .pbtn:disabled{opacity:.35;cursor:default}

<script>
/* =====================================================================
   ATLAS – מערכת תזרים ופרויקטים | שלב א׳ (תבנית ריקה)
   מבנה: utils · state/storage · templates · calc · cashflow · anomalies
   ===================================================================== */
'use strict';

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = p => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
function num(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).replace(/[,₪\s]/g, '').replace(/^\((.*)\)$/, '-$1');
  if (s === '' || s === '-') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const nz = v => num(v) || 0;
function fmtMoney(n, blankZero) {
  if (n === null || n === undefined || n === '') return '';
  const v = Number(n);
  if (!isFinite(v)) return '';
  if (blankZero && v === 0) return '';
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n) {
  if (n === null || n === undefined || n === '') return '';
  const v = Number(n); if (!isFinite(v)) return '';
  return v.toLocaleString('en-US', { maximumFractionDigits: 4 });
}
const pad2 = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
const curMonth = () => todayISO().slice(0, 7);
function isoFromParts(y, m, d) {
  y = +y; m = +m; d = +d;
  if (y < 100) y += 2000;
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return y + '-' + pad2(m) + '-' + pad2(d);
}
function parseDateInput(s) {
  if (s === null || s === undefined) return null;
  if (typeof s === 'number') return excelSerialToISO(s);
  s = String(s).trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return isoFromParts(m[1], m[2], m[3]);
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) return isoFromParts(m[3], m[2], m[1]);
  m = s.match(/^(\d{2})(\d{2})(\d{4})$/);
  if (m) return isoFromParts(m[3], m[2], m[1]);
  if (/^\d{5}(\.\d+)?$/.test(s)) return excelSerialToISO(+s);
  return null;
}
function excelSerialToISO(n) {
  const d = new Date(Math.round((n - 25569) * 86400000));
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; }
function addDays(iso, n) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + Number(n || 0));
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
}
function monthAdd(ym, k) { let [y, m] = ym.split('-').map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad2(m); }
function hoursToHHMM(h) {
  h = num(h); if (h === null) return '';
  const neg = h < 0; h = Math.abs(h);
  let H = Math.floor(h), M = Math.round((h - H) * 60);
  if (M === 60) { H++; M = 0; }
  return (neg ? '-' : '') + H + ':' + pad2(M);
}
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function download(name, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function toast(text, kind, ms) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = text;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), ms || 3800);
}

/* ---------------- state ---------------- */
const SCHEMA = 'atlas-cashflow';

function defaultState() {

    entities: {}, entityOrder: [],
    ops: {
      salaries: { docPath: '', rows: [] }, pensions: { docPath: '', rows: [] },
      authorities: { docPath: '', rows: [] }, bank: { docPath: '', rows: [] },
      credit: { docPath: '', rows: [], imports: [] }
    },
    employees: [], docs: {}, anomalies: {}
  };
}
let S = defaultState();
const UI = { view: 'main', sbOpen: { yazam: true, mod: true, regular: true, ops: true, freelancer: true }, filters: {}, editing: null, flashRow: null, cfShowForecast: null };
const sessionBlobs = {}; // docId -> objectURL (לסשן הנוכחי בלבד)

/* ---------------- storage adapter (נפרד מהקוד) ---------------- */
const Storage = {
  key: 'atlas_cashflow_v1',
  name: 'שמירה מקומית בדפדפן',
  load() { const s = localStorage.getItem(this.key); return s ? JSON.parse(s) : null; },
  save(obj) {
    const json = JSON.stringify(obj);
    localStorage.setItem(this.key, json);
    const back = localStorage.getItem(this.key);
    if (back !== json) throw new Error('אימות שמירה נכשל – הנתון שנקרא חזרה אינו זהה');
    return json.length;
  }
};
let dirty = false, saveTimer = null;
function setSaveState(kind, text) { const el = $('#saveState'); el.className = kind; el.textContent = text; }
function markDirty() {
  dirty = true;
  setSaveState('dirty', '● שינויים לא נשמרו');
  if (S.settings.autosave) { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(true), 1200); }
}
function saveNow(silent) {
  clearTimeout(saveTimer);
  try {
    S.savedAt = new Date().toISOString();
    const bytes = Storage.save(S);
    dirty = false;
    const t = new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    setSaveState('ok', '✓ נשמר ואומת ' + t);
    if (!silent) toast('הנתונים נשמרו ואומתו (' + Math.round(bytes / 1024) + ' KB)', 'ok');
    return true;
  } catch (e) {
    setSaveState('err', '✗ השמירה נכשלה');
    toast('שגיאת שמירה: ' + e.message + ' – מומלץ להוריד גיבוי JSON מיד', 'err', 8000);
    return false;
  }
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

function normalizeState(o) {
  const d = defaultState();
  const s = Object.assign(d, o || {});
  s.settings = Object.assign(defaultState().settings, (o && o.settings) || {});
  s.settings.bankFee = Object.assign(defaultState().settings.bankFee, s.settings.bankFee || {});
  s.ops = Object.assign(defaultState().ops, s.ops || {});
  for (const k of Object.keys(defaultState().ops)) {
    s.ops[k] = Object.assign({ docPath: '', rows: [] }, s.ops[k] || {});
    if (!Array.isArray(s.ops[k].rows)) s.ops[k].rows = [];
  }
  if (!Array.isArray(s.ops.credit.imports)) s.ops.credit.imports = [];
  s.entities = s.entities || {};
  s.entityOrder = (s.entityOrder || []).filter(id => s.entities[id]);
  for (const id of Object.keys(s.entities)) { if (!s.entityOrder.includes(id)) s.entityOrder.push(id); const e = s.entities[id]; if (!Array.isArray(e.rows)) e.rows = []; e.rows.forEach(migrateOffset); }
  // פנסיות: מבנה ישן (amount/depType) → מבנה חדש
  s.ops.pensions.rows.forEach(r => {
    if (r.amount !== undefined && r.empDeposit === undefined && r.erDeposit === undefined && r.severance === undefined) {
      r.ov = r.ov || {}; if (nz(r.amount)) r.ov.total = nz(r.amount);
      if (!r.fundKind && r.depType) r.fundKind = r.depType;
      if (r.status === undefined) r.status = !!r.payDate;
      delete r.amount; delete r.depType;
    }
  });
  s.employees = s.employees || []; s.docs = s.docs || {}; s.anomalies = s.anomalies || {};
  return s;
}

/* ---------------- tabs ---------------- */
function tabInfo(tabId) {
  if (tabId && tabId.startsWith('ops:')) {
    const k = tabId.slice(4);
    if (!S.ops[k]) return null;
    return { tabId, kind: k, isOps: true, name: OPS[k], holder: S.ops[k], rows: S.ops[k].rows, cols: COLS[k] };
  }
  const e = S.entities[tabId];
  if (!e) return null;
  return { tabId, kind: e.type, isOps: false, name: e.name, entity: e, holder: e, rows: e.rows, cols: COLS[e.type] };
}
function allTabIds() { return [...S.entityOrder, ...Object.keys(OPS).map(k => 'ops:' + k)]; }
function nextSerial(rows) { return rows.reduce((m, r) => Math.max(m, nz(r.serial)), 0) + 1; }
function employeeName(id) { const e = S.employees.find(x => x.id === id); return e ? e.name : ''; }

/* ספק: ברמת השורה (hasSupplier) וברירת מחדל לשורות חדשות ברמת הפרויקט (supplierForNewRows) */
/* תוספת (+) וקיזוז (−) נשמרים בנפרד כמספרים חיוביים; ההשפעה נטו = תוספת − קיזוז */
function adjNet(row, addKey, dedKey) { return r2(Math.abs(nz(row[addKey])) - Math.abs(nz(row[dedKey]))); }
function rowOffset(row) {
  if (row.offAdd === undefined && row.offDed === undefined) return nz(row.offset);
  return r2(Math.abs(nz(row.offAdd)) - Math.abs(nz(row.offDed)));
}
function migrateOffset(row) {
  if (row && row.offset !== undefined && row.offset !== null && row.offAdd === undefined && row.offDed === undefined) {
    const v = nz(row.offset);
    if (v > 0) row.offAdd = v; else if (v < 0) row.offDed = -v;
  }
  if (row) delete row.offset;
}
function rowHasSupplier(row) { return row.hasSupplier === undefined ? num(row.supplierPct) !== null : !!row.hasSupplier; }
function entitySupplierForNewRows(e) { return e.supplierForNewRows === undefined ? num(e.supplierPctDefault) !== null : !!e.supplierForNewRows; }
function newRow(kind, entity) {
  const d = new Date();
  const base = { id: uid('r'), year: String(d.getFullYear()), month: pad2(d.getMonth() + 1), ov: {} };
  if (['yazam', 'mod', 'regular', 'freelancer'].includes(kind)) base.vatPct = S.settings.vatDefault;
  if (kind === 'mod') { base.rate = null; }
  if (kind === 'yazam' || kind === 'mod') { base.supplierPaid = false; base.hasSupplier = false; }
  // תנאי הפרויקט (ברירות מחדל לשורה חדשה)
  if (entity && PROJECT_TYPES.includes(kind)) {
    if (num(entity.termDays) !== null) base.term = String(num(entity.termDays));
    if (kind !== 'regular') {
      base.hasSupplier = entitySupplierForNewRows(entity);
      if (base.hasSupplier && num(entity.supplierPctDefault) !== null) base.supplierPct = num(entity.supplierPctDefault);
    }
  }
  if (kind === 'salaries') base.status = false;
  if (kind === 'bank') { delete base.year; delete base.month; base.date = todayISO(); base.txType = 'other'; base.direction = 'out'; }
  if (kind === 'credit') { delete base.year; delete base.month; base.source = 'ידני'; base.category = 'כללי'; }
  if (kind === 'authorities') { delete base.year; delete base.month; }
  return base;
}

/* ---------------- calc ---------------- */
function calcRow(kind, row) {
  const ov = row.ov || {};
  const has = k => Object.prototype.hasOwnProperty.call(ov, k) && ov[k] !== null && ov[k] !== '';
  const c = { auto: {}, isOv: {} };
  const pick = (k, auto) => { c.auto[k] = auto; c.isOv[k] = has(k); c[k] = has(k) ? ov[k] : auto; return c[k]; };
  const vat = nz(row.vatPct);
  const offsetDays = nz(S.settings.supplierPayOffsetDays);

  if (kind === 'yazam' || kind === 'mod' || kind === 'regular') {
    if (kind === 'yazam' || kind === 'regular') {
      const net = nz(row.net);
      c.vatAmt = r2(net * vat / 100);
      c.total = r2(net + c.vatAmt);
    } else {
      const hours = nz(row.hours);
      c.hhmm = hoursToHHMM(row.hours);
      c.preVat = r2(hours * nz(row.rate) + nz(row.km) * nz(S.settings.kmRate) + nz(row.offroad));
      pick('total', r2(c.preVat * (1 + vat / 100)));
      c.total = nz(c.total);
    }
    c.base = r2(c.total + rowOffset(row));
    if (row.term === 'manual') c.expectedDate = row.expectedManual || '';
    else c.expectedDate = (row.submitted && row.term) ? addDays(row.submitted, row.term) : '';
    // כלל מסמכים: תאריך קבלת כסף אוטומטי נקבע רק כאשר הוזן ח. מס קבלה / קבלה
    const hasReceipt = !!(String(row.taxReceiptNo || '').trim() || String(row.receiptNo || '').trim());
    pick('moneyDate', hasReceipt ? (c.expectedDate || row.submitted || '') : '');
    c.paid = !!c.moneyDate;
    c.supplierOn = kind !== 'regular' && rowHasSupplier(row);
    if (c.supplierOn) {
      const pct = num(row.supplierPct);
      // תוספת/קיזוז של הלקוח לא עוברים לספק אוטומטית; התאמה לספק מוזנת בתא "תוספת / קיזוז לספק"
      c.supAdjNet = adjNet(row, 'supAdd', 'supDed');
      pick('supplierPay', pct === null ? null : r2(c.total * (1 - pct / 100) + c.supAdjNet));
      if (c.supplierPay !== null && c.supplierPay !== undefined) c.supplierPay = num(c.supplierPay);
      pick('supplierPayDate', c.moneyDate ? addDays(c.moneyDate, offsetDays) : '');
      c.supplierPayDateForecast = c.supplierPayDate || (c.expectedDate ? addDays(c.expectedDate, offsetDays) : '');
    } else {
      // ללא ספק: כל התשלום נשאר באטלס; ערכי ספק שהוזנו נשמרים בשורה אך אינם משפיעים
      c.supplierPay = null; c.auto.supplierPay = null; c.isOv.supplierPay = false;
      c.supplierPayDate = ''; c.auto.supplierPayDate = ''; c.isOv.supplierPayDate = false; c.supplierPayDateForecast = '';
    }
    c.atlasNet = r2(c.base - nz(c.supplierPay));
  } else if (kind === 'freelancer') {
    pick('total', r2(nz(row.net) * (1 + vat / 100)));
    c.total = nz(c.total);
    c.base = r2(c.total + rowOffset(row));
  } else if (kind === 'pensions') {
    pick('total', r2(nz(row.empDeposit) + nz(row.erDeposit) + nz(row.severance)));
    c.total = nz(c.total);
    c.inCashflow = !!(row.status && row.payDate && c.total);
  } else if (kind === 'salaries') {
    // פנסיה להעברה = עובד + מעסיק + פיצויים ; קרן השתלמות = עובד + מעסיק (ניתן לדריסה)
    pick('pensionTransfer', r2(nz(row.pensionEmployee) + nz(row.pensionEmployer) + nz(row.severance)));
    pick('kerenTransfer', r2(nz(row.kerenEmployee) + nz(row.kerenEmployer)));
    c.pensionTransfer = nz(c.pensionTransfer); c.kerenTransfer = nz(c.kerenTransfer);
    c.funds = r2(c.pensionTransfer + c.kerenTransfer);
    c.employerCost = r2(nz(row.grossTotal) + nz(row.pensionEmployer) + nz(row.severance) + nz(row.kerenEmployer));
    // תנועה בתזרים רק כשהמשכורת סומנה "שולם" ויש תאריך תשלום
    c.cfDate = row.payDate || '';
    c.inCashflow = !!(row.status && row.payDate && nz(row.net));
  } else if (kind === 'bank') {
    c.dir = row.txType === 'deposit' ? 'in' : (row.txType === 'other' ? (row.direction || 'out') : 'out');
  }
  return c;
}

/* ---------------- cashflow (נגזר – לא נשמר) ---------------- */
const DOC_LABELS = { dealNo: 'ח.עסקה', taxInvNo: 'ח.מס', taxReceiptNo: 'ח.מס קבלה', receiptNo: 'קבלה', supplierDocNo: 'ספק', docNo: 'מסמך' };
function buildCashflow() {
  const out = [];
  const today = todayISO();
  const push = o => { if (o.date && o.amount) out.push(o); };
  for (const id of S.entityOrder) {
    const t = tabInfo(id); if (!t) continue;
    for (const row of t.rows) {
      const c = calcRow(t.kind, row);
      const isProj = PROJECT_TYPES.includes(t.kind);
      // היררכיה בגיליון הראשי: סוג פרויקט › לקוח › פרויקט
      const refBase = { tabId: id, rowId: row.id, serial: row.serial, tabName: t.name, group: isProj ? TYPE_LABEL[t.kind] : GROUP_LABEL[t.kind], client: isProj ? (t.entity.client || '') : t.name };
      if (PROJECT_TYPES.includes(t.kind)) {
        const docs = ['dealNo', 'taxInvNo', 'taxReceiptNo', 'receiptNo'].filter(k => row[k]).map(k => ({ field: k, no: row[k] }));
        push(Object.assign({}, refBase, {
          key: id + '|' + row.id + '|in', dir: 'in', role: 'הכנסה לאטלס', amount: c.base,
          date: c.moneyDate || c.expectedDate, status: c.moneyDate ? 'actual' : 'forecast',
          entity: t.name, desc: (t.entity.owner ? 'אחראי: ' + t.entity.owner + ' · ' : '') + 'חודש ' + (row.month || '') + '/' + (row.year || ''), docs
        }));
        if (c.supplierPay) {
          const sd = c.supplierPayDate || c.supplierPayDateForecast;
          push(Object.assign({}, refBase, {
            key: id + '|' + row.id + '|sup', dir: 'out', role: 'תשלום לספק', amount: c.supplierPay,
            date: sd, status: row.supplierPaid ? 'actual' : 'forecast', entity: t.name,
            desc: 'תשלום לספק · תאריך נגזר מתאריך קבלת הכסף של אטלס', docs: [{ field: 'supplierDocNo', no: row.supplierDocNo || '', zero: String(row.supplierDocNo || '').trim() === '0' || !String(row.supplierDocNo || '').trim() }]
          }));
        }
      } else if (t.kind === 'freelancer') {
        push(Object.assign({}, refBase, {
          key: id + '|' + row.id, dir: 'out', role: 'תשלום לעצמאי', amount: c.base, date: row.payDate,

/* ---------------- anomalies ---------------- */
function detectAnomalies() {
  const list = [];
  for (const id of S.entityOrder) {
    const t = tabInfo(id); if (!t) continue;
    const fields = OVERRIDABLE_NUM[t.kind] || [];
    for (const row of t.rows) {
      const c = calcRow(t.kind, row);
      for (const f of fields) {
        if (!c.isOv[f]) continue;
        const existing = num(row.ov[f]), computed = num(c.auto[f]);
        if (computed === null || existing === null) continue;
        const diff = r2(existing - computed);
        if (Math.abs(diff) < 0.005) continue;
        const key = id + '|' + row.id + '|' + f;
        const dec = S.anomalies[key];
        const decided = dec && dec.value === existing ? dec : null;
        list.push({
          key, tabId: id, rowId: row.id, field: f, tabName: t.name, serial: row.serial,
          label: (COLS[t.kind].find(x => x.key === f) || {}).label || f,
          existing, computed, diff, formula: FORMULA[t.kind + '.' + f] || '',
          status: decided ? decided.status : 'pending', note: decided ? decided.note : '', decidedAt: decided ? decided.decidedAt : ''
        });
      }
    }
  }
  return list;
}

const CAL_MIN_YEAR = 2023;
/* רכיב לוח שנה אחיד לכל האתר.

function openCalendar(anchor, opts) {
  closePopups();

  const cur = opts.value || today;

  const maxYear = Math.max(new Date().getFullYear() + 3, y);

    const atMin = y === minYear && m === 1, atMax = y === maxYear && m === 12;

      html += '<td><button data-iso="' + iso + '" class="' + cls.trim() + '">' + d + '</button></td>';

    }

    pop.innerHTML = html;
    $('.prev', pop).onclick = () => { if (atMin) return; m--; if (m < 1) { m = 12; y--; } draw(); };
    $('.next', pop).onclick = () => { if (atMax) return; m++; if (m > 12) { m = 1; y++; } draw(); };

  draw();
  positionPop(pop, anchor);
}

function statHTML(label, value, cls) { return '<div class="stat ' + (cls || '') + '"><div class="l">' + esc(label) + '</div><div class="v">' + value + '</div></div>'; }

    Object.keys(byCat).slice(0, 8).forEach(k => h += statHTML(k, fmtMoney(byCat[k])));
  }
  h += '</div>';
  const fk = Object.keys(tabFilters(t.tabId)).filter(k => tabFilters(t.tabId)[k]);

/* =====================================================================
   DocFS – שמירת מסמכים בפועל לתיקייה במחשב (File System Access API)
   הדפדפן אינו רשאי לכתוב לנתיב טקסטואלי כלשהו. המשתמש מחבר פעם אחת
   "תיקיית בסיס" (למשל C:\ATLAS), וכל נתיב מסמכים של חוצץ נפתר ביחס אליה.
   ===================================================================== */
const IDB = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('atlas_fs', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};
const sessionFiles = {}; // docId -> File (לשמירה חוזרת בסשן הנוכחי)

const DocFS = {
  supported: typeof window.showDirectoryPicker === 'function',
  root: null,
  get rootName() { return this.root ? this.root.name : ''; },
  async init() {
    try { const h = await IDB.get('docRoot'); if (h) { this.root = h; return true; } } catch (e) { }
    return false;
  },
  async connect() {
    const h = await window.showDirectoryPicker({ id: 'atlas-docs', mode: 'readwrite' });
    this.root = h;
    try { await IDB.set('docRoot', h); } catch (e) { }
    return h;
  },
  async setRoot(h) { this.root = h; try { await IDB.set('docRoot', h); } catch (e) { } },
  async disconnect() { this.root = null; try { await IDB.del('docRoot'); } catch (e) { } },
  async permission(ask) {
    if (!this.root) return false;
    if (typeof this.root.queryPermission !== 'function') return true;
    let p = await this.root.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') return true;
    if (!ask) return false;
    p = await this.root.requestPermission({ mode: 'readwrite' });
    return p === 'granted';
  },
  /* פירוק נתיב החוצץ לתתי-תיקיות מתחת לתיקיית הבסיס */
  resolve(docPath) {
    const raw = String(docPath || '').trim();
    if (!raw) return { ok: false, error: 'לא הוגדר נתיב שמירת מסמכים לחוצץ' };
    if (!this.root) return { ok: false, error: 'לא חוברה תיקיית מסמכים במחשב' };
    const clean = raw.replace(/^file:\/+/i, '');
    let segs = clean.split(/[\\/]+/).filter(s => s && s !== '.');
    if (segs.some(s => s === '..')) return { ok: false, error: 'הנתיב אינו יכול לכלול ".."' };
    const isAbs = /^[a-zA-Z]:$/.test(segs[0] || '') || /^[\\/]/.test(clean);
    if (isAbs) {
      const rn = this.rootName.toLowerCase();
      let idx = -1;
      segs.forEach((s, i) => { if (s.toLowerCase() === rn) idx = i; });
      if (idx < 0) return { ok: false, error: 'התיקייה שחוברה ("' + this.rootName + '") אינה חלק מהנתיב ' + raw + '. חבר תיקייה שמופיעה בנתיב, למשל "' + (segs[1] || segs[0]) + '".' };
      segs = segs.slice(idx + 1);
    }
    segs = segs.map(s => s.replace(/[<>:"|?*]/g, '_').trim()).filter(Boolean);
    return { ok: true, segs };
  },
  displayTarget(docPath) { const r = this.resolve(docPath); return r.ok ? [this.rootName, ...r.segs].join(' › ') : ''; },
  async dirFor(docPath, create) {
    const r = this.resolve(docPath);
    if (!r.ok) throw new Error(r.error);
    let d = this.root;
    for (const s of r.segs) d = await d.getDirectoryHandle(s, { create });
    return { dir: d, segs: r.segs };
  },
  async exists(dir, name) { try { return await (await dir.getFileHandle(name)).getFile(); } catch (e) { return null; } },
  async save(docPath, file, opts) {
    const { dir, segs } = await this.dirFor(docPath, true);
    let name = file.name.replace(/[\\/<>:"|?*]/g, '_');
    let note = '';
    const ex = await this.exists(dir, name);
    if (ex && opts && opts.overwrite) note = 'הקובץ הקיים עודכן';
    else if (ex) {
      if (ex.size === file.size) return { name, segs, note: 'קובץ זהה כבר קיים בתיקייה – לא נשמר עותק נוסף' };
      const m = name.match(/^(.*?)(\.[^.]*)?$/); const base = m[1], ext = m[2] || '';
      let i = 2; while (await this.exists(dir, base + ' (' + i + ')' + ext)) i++;
      name = base + ' (' + i + ')' + ext;
      note = 'קובץ אחר באותו שם כבר קיים – נשמר בשם ' + name;
    }
    let fh;
    try { fh = await dir.getFileHandle(name, { create: true }); }
    catch (e) {
      // יש מערכות קבצים שדוחות שמות מסוימים – ניסיון חוזר בשם חלופי
      if (!(opts && opts.fallbackName) || opts.fallbackName === name) throw e;
      name = opts.fallbackName; note = 'השם המקורי נדחה על ידי מערכת הקבצים – נשמר בשם ' + name;
      if (await this.exists(dir, name) && !opts.overwrite) throw e;
      fh = await dir.getFileHandle(name, { create: true });
    }
    const w = await fh.createWritable();
    await w.write(file); await w.close();
    const check = await this.exists(dir, name);
    if (!check || check.size !== file.size) throw new Error('אימות הכתיבה נכשל עבור ' + name);
    return { name, segs, note };
  },
  async read(docPath, name) { const { dir } = await this.dirFor(docPath, false); return (await dir.getFileHandle(name)).getFile(); },
  async testWrite() {
    const name = '.atlas_write_test.txt';
    const fh = await this.root.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write('ok ' + new Date().toISOString()); await w.close();
    const f = await fh.getFile(); const ok = f.size > 0;
    try { await this.root.removeEntry(name); } catch (e) { }
    return ok;
  }
};
function fsErrText(e) {
  if (!e) return '';
  if (e.name === 'AbortError') return 'בחירת התיקייה בוטלה';
  if (e.name === 'NotAllowedError' || e.name === 'SecurityError') return 'הדפדפן לא אישר גישה לתיקייה';
  if (e.name === 'NotFoundError') return 'הקובץ או התיקייה לא נמצאו';
  return e.message || String(e);
}
async function connectDocFolder(silent) {
  if (!DocFS.supported) { toast('שמירה לתיקייה נתמכת רק ב-Chrome או Edge במחשב', 'err', 7000); return false; }
  try {
    await DocFS.connect();
    if (!silent) toast('תיקיית המסמכים חוברה: ' + DocFS.rootName, 'ok');
    render();
    return true;
  } catch (e) { toast(fsErrText(e), 'warn'); return false; }
}
/* שמירת מסמך מקושר לתיקייה (בזמן גרירה או שמירה חוזרת) */
async function saveDocToFolder(t, doc, file) {
  const r = await DocFS.save(t.holder.docPath, file);
  doc.fileName = r.name;
  doc.saved = true;
  doc.savedTo = [DocFS.rootName, ...r.segs].join('\\');
  doc.savedAt = new Date().toISOString();
  delete doc.saveError;
  return r;
}

  const gw = $('.grid-wrap'); const gs = gw ? { top: gw.scrollTop, left: gw.scrollLeft, tab: gw.dataset.tab } : null;

function docBarHTML(t) {

    '<div class="r2">' + docTargetHTML(t) +
    '<button class="btn sm doc-toggle" data-act="toggledocs">📄 מסמכים (' + docs.length + ')' + (unsaved ? ' <span class="badge">' + unsaved + '</span>' : '') + ' ' + (open ? '▴' : '▾') + '</button></div></div>' +
    (open ? '<div class="doclist">' + (docs.length ? docs.map(d => { const r = rowById[d.rowId]; const col = t.cols.find(c => c.key === d.field); return '<div>📄 ' + esc(d.fileName) + ' ← שורה ' + esc(r ? r.serial : '?') + ' · ' + esc(col ? col.label : d.field) + ' ' + esc(d.number || '') + ' ' + status(d) + ' <button class="btn sm" data-act="unlinkdoc" data-doc="' + d.id + '">ביטול קישור</button></div>'; }).join('') : '<span class="muted">טרם קושרו מסמכים</span>') + '</div>' : '') +

function docPathOf(t, doc) { const base = (t.holder.docPath || '').trim(); return doc && doc.subdir && base ? base.replace(/[\\/]+$/, '') + '/' + doc.subdir : base; }
function resolveDocURL(t, doc) {
  const base = docPathOf(t, doc);
  if (!base) return null;
  let p = base.replace(/\\/g, '/');
  if (!p.endsWith('/')) p += '/';
  const url = /^(https?:|file:)/i.test(p) ? p : 'file:///' + p.replace(/^\/+/, '');
  return url + encodeURIComponent(doc.fileName).replace(/%2F/g, '/');
}
async function openDoc(t, row, field) {
  const val = String(row[field] || '').trim();
  const doc = findDoc(t.tabId, row.id, field);
  if (!doc) { toast('לא נמצא מסמך מקושר למספר ' + val + '. גרור את קובץ ה-PDF לאזור המסמכים כדי לקשר אותו.', 'warn', 5000); return; }
  // 1) פתיחה מתוך תיקיית המסמכים שחוברה (כולל תת-תיקייה, למשל תיקיית עובד)
  const dp = docPathOf(t, doc);
  if (DocFS.root && t.holder.docPath && DocFS.resolve(dp).ok) {
    try {
      const granted = await DocFS.permission(true);
      if (!granted) throw Object.assign(new Error('no permission'), { name: 'NotAllowedError' });
      const f = await DocFS.read(dp, doc.fileName);
      const url = URL.createObjectURL(f) + (doc.page ? '#page=' + doc.page : '');
      const w = window.open(url, '_blank');
      if (!w) toast('הדפדפן חסם את החלון – לחץ שוב על מספר המסמך', 'warn');
      return;
    } catch (e) {
      if (e.name === 'NotFoundError') { toast('הקובץ ' + doc.fileName + ' לא נמצא בתיקייה ' + DocFS.displayTarget(dp) + '. גרור אותו שוב כדי לשמור ולקשר.', 'err', 7000); return; }
      if (!sessionBlobs[doc.id]) { toast('לא ניתן לפתוח מהתיקייה: ' + fsErrText(e), 'err', 6000); return; }
    }
  }
  // 2) קובץ שנגרר בסשן הנוכחי
  if (sessionBlobs[doc.id]) { window.open(sessionBlobs[doc.id] + (doc.page ? '#page=' + doc.page : ''), '_blank'); return; }
  // 3) ניסיון אחרון – קישור file:// לפי הנתיב
  const url = resolveDocURL(t, doc);
  if (!url) { toast('לא הוגדר נתיב שמירת מסמכים לחוצץ – לא ניתן לפתוח את ' + doc.fileName, 'err', 5000); return; }
  if (!DocFS.root) { toast('חבר את תיקיית המסמכים (בחוצץ או בהגדרות) כדי לפתוח את ' + doc.fileName, 'warn', 6000); }
  window.open(url, '_blank');
}
function extractNumbers(name) { return (name.replace(/\.pdf$/i, '').match(/\d+/g) || []).filter(n => n.length >= 2); }

  const fieldOpts = sel => dfields.map(c => '<option value="' + c.key + '"' + (c.key === sel ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('');
  const path = (t.holder.docPath || '').trim();

  else if (!path) where = '<div class="msg err">לא הוגדר נתיב מסמכים לחוצץ – הקבצים יקושרו אך לא יישמרו. הגדר נתיב ונסה שוב.</div>';
  else if (!DocFS.root) where = '<div class="msg warn">בלחיצה על ״שמור וקשר״ ייפתח חלון בחירת תיקייה: בחר תיקייה שמופיעה בנתיב <b dir="ltr">' + esc(path) + '</b>. הבחירה נדרשת פעם אחת בלבד.</div>';

    '<p class="muted" style="font-size:12px">אם השדה בשורה ריק – המספר שהוזן כאן ייכתב אליו. אם השדה כבר מכיל מספר – הקובץ יקושר למספר הקיים.</p>';
  openModal({

    buttons: [{ label: 'שמור וקשר', cls: 'primary', id: 'pdfCommit', onClick: bg => { commitPdfLinks(t, files, bg); return false; } }, { label: 'ביטול' }]
  });
}
async function commitPdfLinks(t, files, bg) {
  const btn = $('#pdfCommit', bg); if (btn) { btn.disabled = true; btn.textContent = 'שומר…'; }
  const picks = [];
  for (const tr of $$('tr[data-i]', bg)) {
    const i = +tr.dataset.i, rowId = $('.lr', tr).value, field = $('.lf', tr).value, number = $('.ln', tr).value.trim();
    if (!rowId) continue;
    const row = t.rows.find(r => r.id === rowId);
    const cur = String(row[field] || '').trim();
    if (!cur && !number) { toast('לשורה ' + row.serial + ' אין מספר מסמך – ' + files[i].name + ' דולג', 'warn'); continue; }
    picks.push({ file: files[i], row, field, number: cur || number, note: cur && number && cur !== number ? 'קושר למספר הקיים ' + cur : '' });
  }
  if (!picks.length) { closeModal(); return; }
  // חיבור תיקייה והרשאה – חייבים לקרות מיד בתגובה ללחיצה
  let canSave = false, why = '';
  const path = (t.holder.docPath || '').trim();
  if (!DocFS.supported) why = 'הדפדפן אינו תומך בשמירה לתיקייה';
  else if (!path) why = 'לא הוגדר נתיב מסמכים לחוצץ';
  else {
    try {
      if (!DocFS.root) await DocFS.connect();
      canSave = await DocFS.permission(true);
      if (!canSave) why = 'לא ניתנה הרשאת כתיבה לתיקייה';
      else { const r = DocFS.resolve(path); if (!r.ok) { canSave = false; why = r.error; } }
    } catch (e) { why = fsErrText(e); }
  }
  let saved = 0; const notes = [];
  for (const p of picks) {
    if (!String(p.row[p.field] || '').trim()) p.row[p.field] = p.number;
    const old = findDoc(t.tabId, p.row.id, p.field);
    if (old) delete S.docs[old.id];
    const id = uid('doc');
    const doc = S.docs[id] = { id, tabId: t.tabId, rowId: p.row.id, field: p.field, number: String(p.row[p.field]).trim(), fileName: p.file.name, size: p.file.size, linkedAt: new Date().toISOString(), pathAtLink: path, saved: false };
    sessionBlobs[id] = URL.createObjectURL(p.file);
    sessionFiles[id] = p.file;
    if (p.note) notes.push(p.file.name + ': ' + p.note);
    if (canSave) {
      try { const r = await saveDocToFolder(t, doc, p.file); saved++; if (r.note) notes.push(p.file.name + ': ' + r.note); }
      catch (e) { doc.saveError = fsErrText(e); notes.push(p.file.name + ': השמירה נכשלה – ' + doc.saveError); }
    } else doc.saveError = why;
  }
  closeModal(); markDirty(); render();
  if (saved === picks.length) toast(saved + ' מסמכים נשמרו בתיקייה ' + DocFS.displayTarget(path) + ' וקושרו', 'ok', 6000);
  else if (saved) toast(saved + ' מתוך ' + picks.length + ' מסמכים נשמרו. ' + (why || ''), 'warn', 7000);
  else toast(picks.length + ' מסמכים קושרו אך לא נשמרו בתיקייה: ' + why, 'err', 8000);
  notes.forEach(n => toast(n, 'info', 7000));
}

/* ---------------- field updates ---------------- */
function setField(t, rowId, key, raw, type, isOv) {
  const row = t.rows.find(r => r.id === rowId); if (!row) return;
  row.ov = row.ov || {};
  let val = raw;
  if (type === 'num') {
    if (String(raw).trim() === '') val = null;
    else { val = num(raw); if (val === null) { toast('ערך מספרי לא תקין: ' + raw, 'err'); render(); return; } }
  } else if (type === 'date') {
    const p = parseDateInput(raw);
    if (p === null) { toast('תאריך לא תקין: ' + raw + ' (פורמט dd/mm/yyyy)', 'err'); render(); return; }
    val = p;
  } else if (type === 'year') {
    val = String(raw).trim();
    if (val && !/^\d{4}$/.test(val)) { toast('שנה לא תקינה', 'err'); render(); return; }
  } else if (type === 'employee') {
    if (raw === '__new') { addEmployeeModal(emp => { row.employeeId = emp.id; markDirty(); }); return; }
  } else if (typeof val === 'string') val = val.trim();

  if (key === 'offAdd' || key === 'offDed') { if (val !== null) val = Math.abs(val); migrateOffset(row); }
  if ((key === 'supAdd' || key === 'supDed') && val !== null) val = Math.abs(val);
  if (isOv) {
    const c = calcRow(t.kind, row);
    if (val === null || val === '') delete row.ov[key];
    else if (type === 'num' && Math.abs(nz(val) - nz(c.auto[key])) < 0.005) delete row.ov[key];
    else if (type === 'date' && val === c.auto[key]) delete row.ov[key];
    else row.ov[key] = val;
  } else {
    row[key] = val;
  }
  if (row.auto && t.kind === 'bank' && key === 'amount') row.autoEdited = true;
  if ((t.kind === 'salaries' || t.kind === 'pensions') && key === 'payDate') delete row.payDateAuto;
  if (key === 'term' && val !== 'manual') delete row.expectedManual;
  if (UI.editing === rowId + ':' + key) UI.editing = null;
  markDirty();
  render();
}

   חוצץ „משכורות” – מקור בלעדי לשכר

/* ---------------- פענוח תלושי שכר ---------------- */
// הפונט בתלושי שיקלולית מקודד עברית בתווי MacRoman והטקסט שמור הפוך
const PS_GLYPH = { '∑': 'א', '∏': 'ב', 'π': 'ג', '\u009b': 'ג', '∫': 'ד', 'ª': 'ה', 'º': 'ו', 'Ω': 'ז', 'æ': 'ח', 'ø': 'ט', '¿': 'י', '¡': 'ך', '¬': 'כ', '√': 'ל', 'ƒ': 'ם', '≈': 'מ', '∆': 'ן', '«': 'נ', '»': 'ס', '…': 'ע', 'À': 'ף', 'Ã': 'פ', 'Õ': 'ץ', 'Œ': 'צ', 'œ': 'ק', '–': 'ר', '—': 'ש', '“': 'ת' };
function psDecode(s) {
  if (/[\u0590-\u05FF]/.test(s)) return s;
  // תלוש שנשמר מחדש (למשל אחרי פיצול) – עברית בטווח U+02A0 והפוכה
  if (/[\u02A0-\u02BF]/.test(s)) return [...s].map(ch => { const c = ch.charCodeAt(0); return c >= 0x2A0 && c <= 0x2BF ? String.fromCharCode(c + 0x330) : ch; }).reverse().join('');
  if (![...s].some(ch => PS_GLYPH[ch] && ch !== '\u009b')) return s;
  return [...s].map(ch => PS_GLYPH[ch] || ch).reverse().join('');
}
const psNum = s => { const m = String(s).replace(/,/g, '').match(/^-?\d+(\.\d+)?$/); return m ? parseFloat(m[0]) : null; };
function psLines(items) {
  const its = items.filter(i => i.str && i.str.trim()).map(i => ({ s: psDecode(i.str.trim()), x: i.transform[4], y: i.transform[5] }));
  its.sort((a, b) => b.y - a.y || b.x - a.x);
  const lines = []; let cur = null;
  for (const it of its) { if (!cur || Math.abs(it.y - cur.y) > 2.5) { cur = { y: it.y, it: [] }; lines.push(cur); } cur.it.push(it); }
  return lines;
}
function parsePayslipPage(items) {
  const lines = psLines(items);
  const all = lines.flatMap(l => l.it);
  const find = re => all.find(i => re.test(i.s));
  const r = { payments: [], deductions: [] };
  const mon = find(/^תלוש משכורת לחודש/);
  if (!mon) return null;
  const mm = all.find(i => Math.abs(i.y - mon.y) < 3 && /^\d{1,2}\/\d{4}$/.test(i.s)) || { s: (mon.s.match(/(\d{1,2}\/\d{4})/) || [])[1] || '' };
  const mp = (mm.s || '').split('/'); if (mp.length === 2) r.month = mp[1] + '-' + pad2(mp[0]);
  const hEmp = find(/^מס' עובד$/), hName = find(/^שם עובד$/);
  if (hEmp) {
    const data = lines.find(l => l.y < hEmp.y - 5 && l.y > hEmp.y - 24 && l.it.some(i => /[\u0590-\u05FF]/.test(i.s) && (!hName || Math.abs(i.x - hName.x) < 110)));
    if (data) {
      const heb = data.it.filter(i => /[\u0590-\u05FF]/.test(i.s) && (!hName || Math.abs(i.x - hName.x) < 110));
      r.name = heb.sort((a, b) => a.x - b.x).map(i => i.s).join(' ').replace(/\s+/g, ' ').trim();
      const en = data.it.filter(i => /^\d{1,6}$/.test(i.s)).sort((a, b) => Math.abs(a.x - hEmp.x) - Math.abs(b.x - hEmp.x))[0];
      if (en) r.empNo = en.s;
      const sd = data.it.find(i => /^\d{2}\/\d{2}\/\d{2,4}$/.test(i.s));
      if (sd) { const [d, m, y] = sd.s.split('/'); r.startDate = (y.length === 2 ? '20' + y : y) + '-' + m + '-' + d; }
    }
  }
  const near = h => h && all.filter(i => i.y < h.y - 3 && i.y > h.y - 14 && Math.abs(i.x - h.x) < 30).sort((a, b) => Math.abs(a.x - h.x) - Math.abs(b.x - h.x))[0];
  const rv = near(find(/^תעריף שעה$/)); if (rv && psNum(rv.s) !== null) r.hourlyRate = psNum(rv.s);
  const hv = near(find(/^שעות עבודה$/)); if (hv) { const m = hv.s.match(/^([\d.]+)/); if (m) r.hours = parseFloat(m[1]); }

    const desc = l.it.find(i => i.x > 440 && /[\u0590-\u05FF]/.test(i.s));
    const amt = l.it.filter(i => psNum(i.s) !== null && i.x > 130 && i.x < 230).sort((a, b) => a.x - b.x)[0];
    if (desc && amt) r.payments.push({ label: desc.s, amount: psNum(amt.s) });
  }
  if (hDed) for (const l of lines) {
    if (l.y >= hDed.y - 2 || (netL && l.y <= netL.y)) continue;
    const desc = l.it.find(i => i.x > 440 && /[\u0590-\u05FF]/.test(i.s));
    const amt = l.it.find(i => psNum(i.s) !== null && i.x > 380 && i.x < 470);

  }
  const leftVal = (re, below) => {
    const lab = find(re); if (!lab) return null;
    const n = all.filter(i => psNum(i.s) !== null && i.x < lab.x && i.y <= lab.y + 2 && i.y >= lab.y - (below || 2)).sort((a, b) => b.y - a.y)[0];
    return n ? psNum(n.s) : null;

  r.gross = leftVal(/^סה"כ תשלומים$/);
  r.totalDeductions = leftVal(/^סה"כ ניכויים$/) || r2(r.deductions.reduce((a, d) => a + d.amount, 0));
  r.net = leftVal(/^נטו לתשלום$/);
  r.pensionEmployer = leftVal(/^קופ"ג מעסיק.?חודשי$/, 14) || 0;
  r.kerenEmployer = leftVal(/^קה"ל מעסיק.?חודשי$/, 14) || 0;
  r.severance = leftVal(/^פיצויים חודשי$/) || 0;
  const bt = find(/^בתאריך$/);
  if (bt) { const d = all.find(i => Math.abs(i.y - bt.y) < 3 && /^\d{2}\/\d{2}\/\d{4}$/.test(i.s)); if (d) { const [dd, m, y] = d.s.split('/'); r.reportDate = y + '-' + m + '-' + dd; } }
  r.baseSalary = 0; r.recuperation = 0; r.holidayGift = 0; r.travelOther = 0;
  let baseSeen = false;
  for (const p of r.payments) {
    if (/הבראה/.test(p.label)) r.recuperation += p.amount;
    else if (/שי לחג|שי|חג|מתנה/.test(p.label)) r.holidayGift += p.amount;
    else if (!baseSeen && /יסוד|משכורת|שכר/.test(p.label)) { r.baseSalary += p.amount; baseSeen = true; }
    else r.travelOther += p.amount;
  }
  r.pensionEmployee = 0; r.kerenEmployee = 0; r.statutory = 0; r.otherDeductions = 0;
  for (const d of r.deductions) {
    if (/מס הכנסה|ביטוח לאומי|בריאות/.test(d.label)) r.statutory += d.amount;
    else if (/השתלמות/.test(d.label) || (r.kerenEmployer && Math.abs(d.amount - r.kerenEmployer / 3) <= 2)) r.kerenEmployee += d.amount;
    else if (/פנסי|גמל|תגמול|מנהלים|מקפת/.test(d.label) || (r.pensionEmployer && Math.abs(d.amount - r.pensionEmployer * 6 / 6.5) <= Math.max(3, r.pensionEmployer * 0.03))) r.pensionEmployee += d.amount;
    else r.otherDeductions += d.amount;
  }
  ['baseSalary', 'recuperation', 'holidayGift', 'travelOther', 'pensionEmployee', 'kerenEmployee', 'statutory', 'otherDeductions'].forEach(k => r[k] = r2(r[k]));
  return r;
}
async function readPayslipPdf(file) {
  if (!window.pdfjsLib) throw new Error('ספריית קריאת PDF לא נטענה (נדרש חיבור לאינטרנט בפתיחת האתר)');

/* ---------------- פעולות ---------------- */
function salaryAction(act, el, e, t) {
  const st = salState();
  switch (act) {
    case 'saltab': st.tab = el.dataset.tab; if (st.tab !== 'employee') st.back = null; render(); break;
    case 'salback': goBackFromEmployee(st); break;
    case 'salprev': case 'salnext': { const nm = monthAdd(st.month, act === 'salprev' ? -1 : 1); if (nm >= CAL_MIN_YEAR + '-01') { st.month = nm; render(); } break; }
    case 'salpickmonth': openCalendar(el, { value: st.month + '-01', pickMonth: true, onPick: iso => { st.month = iso.slice(0, 7); render(); } }); break;
    case 'salgoemp': e.preventDefault(); goToEmployee(st, el.dataset.emp); break;
    case 'saladdemp': addEmployeeModal(emp => { st.emp = emp.id; }); break;
    case 'saleditemp': e.preventDefault(); editEmployeeModal(el.dataset.emp); break;
    case 'saladdrow': salAddRowModal(st.tab === 'employee' ? st.emp : '', st.tab === 'month' ? st.month : curMonth()); break;
    case 'saladdfor': e.preventDefault(); salAddRowModal(el.dataset.emp, st.tab === 'month' ? st.month : curMonth()); break;
    case 'salslip': { const row = t.rows.find(r => r.id === el.dataset.row); if (row) openDoc(t, row, 'payslip'); break; }
    case 'salpick': {
      if (e.target.closest('input,button,a')) return;
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pdf,application/pdf';
      inp.onchange = () => inp.files[0] && handlePayslipFile(inp.files[0]); inp.click(); break;
    }
    case 'salxlsx': {
      if (st.tab === 'year') {
        const data = salYearData(st.year);
        exportExcel('סיכום שכר שנתי ' + st.year, ['עובד', ...SAL_YEAR_COLS.map(x => x[1])], data.map(d => [d.emp.name, ...SAL_YEAR_COLS.map(([k]) => d[k])]));
      } else {
        const rows = st.tab === 'month' ? t.rows.filter(r => rowMonth(r) === st.month) : salRowsOf(st.emp);
        const cols = t.cols.filter(c => !['serial', 'year', 'month'].includes(c.key));
        exportExcel('משכורות ' + (st.tab === 'month' ? monthLabel(st.month) : employeeName(st.emp)), ['חודש', ...cols.map(c => c.label)], rows.map(row => { const c = calcRow('salaries', row); return [monthLabel(rowMonth(row)), ...cols.map(col => ['num', 'numAuto', 'computed'].includes(col.type) ? (col.type === 'num' ? (num(row[col.key]) === null ? '' : num(row[col.key])) : c[col.key]) : cellText(t, col, row, c))]; }));
      }
      break;
    }
  }
}

/* =====================================================================
   חוצץ „פנסיות” – הפקדות לקופות (פנסיה / קרן השתלמות / ביטוח מנהלים)
   שורה = עובד × חודש × קופה · יבוא "רשימת תשלומים לתקופת גביה" (שיקלולית)
   ===================================================================== */

/* ---------------- פענוח דוח הפקדות ---------------- */
// בדוח זה הספרות והפיסוק מוזזים בתו אחד אחורה (/ = 0, + = פסיק, - = נקודה) והאות נ מופיעה כ-U+F8FF
const penText = s => String(s).replace(/\uF8FF/g, 'נ');
function penNum(s) {
  s = String(s).trim();
  if (!/^[\/0-8+\-.$]+$/.test(s)) return null;
  const d = [...s].map(ch => String.fromCharCode(ch.charCodeAt(0) + 1)).join('');
  const n = parseFloat(d.replace(/,/g, '').replace(/%$/, ''));
  return isFinite(n) ? n : null;
}
function parsePensionPage(items) {
  const its = items.filter(i => i.str && i.str.trim()).map(i => ({ raw: i.str.trim(), s: penText(i.str.trim()).replace(/!/g, '"'), x: i.transform[4], y: i.transform[5] }));
  its.sort((a, b) => b.y - a.y || b.x - a.x);
  const lines = []; let cur = null;
  for (const it of its) { if (!cur || Math.abs(it.y - cur.y) > 4) { cur = { y: it.y, it: [] }; lines.push(cur); } cur.it.push(it); }
  const title = its.find(i => /רשימת תשלומים לתקופת גביה/.test(i.s));
  if (!title) return null;
  const r = { rows: [] };
  const m = title.s.match(/(\d{1,2})\/(\d{4})/); if (m) r.month = m[2] + '-' + pad2(m[1]);
  if (its.some(i => /סה"כ לכל הקופות/.test(i.s))) { r.summary = true; return r; }
  const fl = lines.find(l => l.it.some(i => /^קופה\s*\d+/.test(i.s)));
  if (fl) {
    const code = fl.it.find(i => /^קופה\s*\d+/.test(i.s));
    r.fundCode = (code.s.match(/\d+/) || [''])[0];
    r.fundName = fl.it.filter(i => i !== code).sort((a, b) => b.x - a.x).map(i => i.s).join(' ').replace(/^-\s*/, '').trim();
  }
  const hName = its.find(i => i.s === 'שם העובד');
  if (!hName) return r;
  const hdr = lines.find(l => l.y > hName.y + 3 && l.y < hName.y + 16);
  const labels = hdr ? hdr.it.filter(i => i.x < 440) : [];
  const keren = labels.some(i => /קה"ל/.test(i.s));
  const fn = r.fundName || '';
  r.fundKind = keren || /השתלמות/.test(fn) ? 'קרן השתלמות' : /מנהלים/.test(fn) ? 'ביטוח מנהלים' : (/גמל/.test(fn) && !/פנסי/.test(fn)) ? 'קופת גמל' : 'פנסיה';
  const cols = [{ k: 'salaryBase', x: 486 }, { k: 'days', x: 446 }, { k: 'total', x: 45 }];
  for (const lb of labels) {
    const side = lb.x > 290 ? 'emp' : 'er';
    const k = /גמל/.test(lb.s) ? 'Gemel' : /כושר/.test(lb.s) ? 'Dis' : /פיצויים/.test(lb.s) ? 'Sev' : /קה"ל/.test(lb.s) ? 'Keren' : 'Other';
    cols.push({ k: side + k, x: lb.x });
  }
  const totL = lines.find(l => l.it.some(i => /סה"כ עובדים/.test(i.s)));
  for (const l of lines) {
    if (l.y >= hName.y - 4 || (totL && l.y <= totL.y + 2)) continue;
    const nameIt = l.it.find(i => /[\u0590-\u05FF]/.test(i.s) && i.x > 650 && i.x < 760);
    if (!nameIt) continue;
    const noIt = l.it.find(i => i.x > 760 && penNum(i.raw) !== null);
    const nm = nameIt.s.replace(/,/g, '-');
    const w = nm.split(/\s+/);
    const row = { empNo: noIt ? String(penNum(noIt.raw)) : '', nameRaw: nm, name: w.length > 1 ? w.slice(1).join(' ') + ' ' + w[0] : nm };
    cols.forEach(c => row[c.k] = 0);
    for (const it of l.it) {
      if (it.x >= 500) continue;
      const v = penNum(it.raw); if (v === null) continue;
      const c = cols.reduce((best, cc) => Math.abs(cc.x - it.x) < Math.abs(best.x - it.x) ? cc : best, cols[0]);
      row[c.k] = r2((row[c.k] || 0) + v);
    }
    row.empDeposit = r2(nz(row.empGemel) + nz(row.empKeren) + nz(row.empDis) + nz(row.empOther));
    row.erDeposit = r2(nz(row.erGemel) + nz(row.erKeren) + nz(row.erDis) + nz(row.erOther));
    row.severance = r2(nz(row.erSev));
    r.rows.push(row);
  }
  return r;
}
async function readPensionPdf(file) {
  if (!window.pdfjsLib) throw new Error('ספריית קריאת PDF לא נטענה (נדרש חיבור לאינטרנט בפתיחת האתר)');
  if (window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const r = parsePensionPage((await (await doc.getPage(i)).getTextContent()).items);
    if (r) { r.page = i; pages.push(r); }
  }
  return pages;
}

function pensionAction(act, el, e, t) {
  const st = penState();
  switch (act) {
    case 'pentab': st.tab = el.dataset.tab; if (st.tab !== 'employee') st.back = null; render(); break;
    case 'penback': goBackFromEmployee(st); break;
    case 'penprev': case 'pennext': { const nm = monthAdd(st.month, act === 'penprev' ? -1 : 1); if (nm >= CAL_MIN_YEAR + '-01') { st.month = nm; render(); } break; }
    case 'penpickmonth': openCalendar(el, { value: st.month + '-01', pickMonth: true, onPick: iso => { st.month = iso.slice(0, 7); render(); } }); break;
    case 'pengoemp': e.preventDefault(); goToEmployee(st, el.dataset.emp); break;
    case 'penaddemp': addEmployeeModal(emp => { st.emp = emp.id; }); break;
    case 'saleditemp': e.preventDefault(); editEmployeeModal(el.dataset.emp); break;
    case 'penaddrow': penAddRowModal(st.tab === 'employee' ? st.emp : '', st.tab === 'month' ? st.month : curMonth()); break;
    case 'penaddfor': e.preventDefault(); penAddRowModal(el.dataset.emp, st.tab === 'month' ? st.month : curMonth()); break;
    case 'penreport': { const row = t.rows.find(r => r.id === el.dataset.row); if (row) openDoc(t, row, 'report'); break; }
    case 'penfundpaid': {
      const k = el.dataset.fund, today = todayISO();
      const rows = t.rows.filter(r => rowMonth(r) === st.month && fundKey(r) === k && !r.status);
      rows.forEach(r => { r.status = true; if (!r.payDate) { r.payDate = today; r.payDateAuto = true; } });
      markDirty(); render();
      toast(rows.length + ' הפקדות סומנו ״שולם״ · תאריך תשלום ריק נקבע להיום ' + fmtDate(today) + ' – ניתן לשנות בכל שורה', 'ok', 5000);
      break;
    }
    case 'penpick': {
      if (e.target.closest('input,button,a')) return;
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pdf,application/pdf';
      inp.onchange = () => inp.files[0] && handlePensionFile(inp.files[0]); inp.click(); break;
    }
    case 'penxlsx': {
      if (st.tab === 'year') {
        const data = penYearData(st.year);
        exportExcel('סיכום הפקדות שנתי ' + st.year, ['עובד', ...PEN_YEAR_COLS.map(x => x[1])], data.map(d => [d.emp.name, ...PEN_YEAR_COLS.map(([k]) => d[k])]));
      } else {
        const rows = st.tab === 'month' ? t.rows.filter(r => rowMonth(r) === st.month) : t.rows.filter(r => r.employeeId === st.emp);
        exportExcel('פנסיות ' + (st.tab === 'month' ? monthLabel(st.month) : employeeName(st.emp)), ['עובד', 'חודש', 'קופה', 'סוג', 'שכר לגמל', 'הפקדת עובד', 'הפקדת מעסיק', 'פיצויים', 'סה״כ להעברה', 'תאריך תשלום', 'סטטוס'],
          rows.map(row => { const c = calcRow('pensions', row); return [employeeName(row.employeeId), monthLabel(rowMonth(row)), row.fundName || '', row.fundKind || '', num(row.salaryBase) ?? '', num(row.empDeposit) ?? '', num(row.erDeposit) ?? '', num(row.severance) ?? '', c.total, fmtDate(row.payDate), row.status ? 'שולם' : 'טרם שולם']; }));
      }
      break;
    }
  }
}

function bindCfInputs() {
  const p = cfPeriod();
  const upd = () => { saveCfPeriod(); UI.cfCollapsed = {}; render(); };
  const fc = $('#cfForecast'); if (fc) fc.onchange = e => { UI.cfShowForecast = e.target.checked; render(); };
  $$('.cfdate').forEach(inp => inp.onchange = () => {
    const iso = parseDateInput(inp.value);
    if (!iso) { toast('תאריך לא תקין (dd/mm/yyyy)', 'err'); render(); return; }
    if (iso < CAL_MIN_YEAR + '-01-01') { toast('ניתן לבחור תאריכים החל משנת ' + CAL_MIN_YEAR, 'warn'); render(); return; }
    const b = periodBounds(p); p.fromDate = b.from; p.toDate = b.to;
    p[inp.dataset.which] = iso;
    if (p.fromDate > p.toDate) [p.fromDate, p.toDate] = [p.toDate, p.fromDate];
    upd();

/* ---------------- non-tab actions ---------------- */
function viewAction(act, el, e) {
  switch (act) {
    case 'cfrebuild': render(); toast('התזרים נבנה מחדש מחוצצי המקור. נתוני המקור לא שונו.', 'ok'); break;
    case 'cfclear': UI.filters.main = {}; render(); break;
    case 'cfsaltoggle': { UI.cfSalOpen = UI.cfSalOpen || {}; UI.cfSalOpen[el.dataset.k] = !UI.cfSalOpen[el.dataset.k]; render(); break; }
    case 'cfmode': { const p = cfPeriod(); p.mode = el.dataset.mode; if (p.mode === 'range' && p.fromDate > p.toDate) [p.fromDate, p.toDate] = [p.toDate, p.fromDate]; saveCfPeriod(); UI.cfCollapsed = {}; render(); break; }
    case 'cfprev': case 'cfnext': { const p = cfPeriod(); const nm = monthAdd(p.month, act === 'cfprev' ? -1 : 1); if (nm < CAL_MIN_YEAR + '-01') return; p.month = nm; saveCfPeriod(); render(); break; }
    case 'cfpickmonth': { const p = cfPeriod(); openCalendar(el, { value: p.month + '-01', pickMonth: true, onPick: iso => { p.month = iso.slice(0, 7); saveCfPeriod(); UI.cfCollapsed = {}; render(); } }); break; }
    case 'cfpickdate': { const p = cfPeriod(), b = periodBounds(p), which = el.dataset.which; openCalendar(el, { value: which === 'fromDate' ? b.from : b.to, onPick: iso => { p.fromDate = b.from; p.toDate = b.to; p[which] = iso; if (p.fromDate > p.toDate) [p.fromDate, p.toDate] = [p.toDate, p.fromDate]; saveCfPeriod(); UI.cfCollapsed = {}; render(); } }); break; }
    case 'cfthis': { const p = cfPeriod(); p.month = curMonth(); saveCfPeriod(); render(); break; }
    case 'cfpreset': {
      const p = cfPeriod(), cm = curMonth(), y = +cm.slice(0, 4);
      if (el.dataset.p === '3') { p.fromDate = monthAdd(cm, -2) + '-01'; p.toDate = monthEnd(cm); }
      else if (el.dataset.p === '6') { p.fromDate = monthAdd(cm, -5) + '-01'; p.toDate = monthEnd(cm); }
      else if (el.dataset.p === 'year') { p.fromDate = y + '-01-01'; p.toDate = y + '-12-31'; }
      else { p.fromDate = (y - 1) + '-01-01'; p.toDate = (y - 1) + '-12-31'; }
      saveCfPeriod(); render(); break;
    }
    case 'cfgomonth': { const p = cfPeriod(); p.mode = 'month'; p.month = el.dataset.m; saveCfPeriod(); render(); window.scrollTo(0, 0); break; }
    case 'cfcollapse': { const c = UI.cfCollapsed || (UI.cfCollapsed = {}); c[el.dataset.m] = !c[el.dataset.m]; render(); break; }
    case 'cffilter': {
      const key = el.dataset.key;
      openFilterPopup(el, () => { const { all } = cfFiltered(); return [...new Set(all.map(r => cfFilterText(r, key)))].sort((a, b) => a.localeCompare(b, 'he', { numeric: true })); },
        tabFilters('main')[key], arr => { tabFilters('main')[key] = arr; render(); });
      break;
    }
    case 'cfsrc': e.preventDefault(); navigate(el.dataset.tab, el.dataset.rowid); break;
    case 'cfdoc': {
      const t = tabInfo(el.dataset.tab); const row = t && t.rows.find(r => r.id === el.dataset.rowid);
      if (!row) return;
      if (!String(row[el.dataset.field] || '').trim() || String(row[el.dataset.field]).trim() === '0') { toast('מסמך חסר – יש להזין מספר מסמך בחוצץ המקור', 'err'); return; }
      openDoc(t, row, el.dataset.field); break;
    }
    case 'cfxlsx': case 'cfpdf': {
      const { rows } = cfFiltered();
      const head = CF_COLS.map(c => c.label);
      const body = rows.map(r => CF_COLS.map(c => c.key === 'income' ? (r.dir === 'in' ? r.amount : '') : c.key === 'expense' ? (r.dir === 'out' ? r.amount : '') : c.key === 'balance' ? r.balance : cfText(r, c.key)));

          const t = tabInfo(a.tabId); const row = t.rows.find(r => r.id === a.rowId);
          delete row.ov[a.field];
          S.anomalies[key] = { status: 'fix', note, value: a.existing, computed: a.computed, decidedAt: new Date().toISOString(), tabName: a.tabName, serial: a.serial, label: a.label };
          markDirty(); render(); toast('הערך תוקן לפי החישוב', 'ok');
        });
      } else {
        S.anomalies[key] = { status, note, value: a.existing, computed: a.computed, decidedAt: new Date().toISOString(), tabName: a.tabName, serial: a.serial, label: a.label };
        markDirty(); render(); toast('ההחלטה נשמרה', 'ok');
      }
      break;
    }
    case 'an-goto': e.preventDefault(); navigate(el.dataset.tab, el.dataset.rowid); break;
    default: if (typeof settingsAction === 'function') settingsAction(act, el, e);
  }
}

/* ---------------- bank monthly fee ---------------- */
function feeFor(month) {
  const hist = S.settings.bankFee.history.slice().sort((a, b) => a.from < b.from ? -1 : 1);
  let amt = 26; for (const hh of hist) if (hh.from <= month) amt = hh.amount; return amt;

function ensureBankFees() {
  const bf = S.settings.bankFee;
  if (!bf.startMonth || !/^\d{4}-\d{2}$/.test(bf.startMonth)) return 0;
  let m = bf.startMonth, created = 0; const end = curMonth(), rows = S.ops.bank.rows;
  let guard = 0;
  while (m <= end && guard++ < 600) {
    if (!bf.generated[m]) {
      const r = newRow('bank');
      Object.assign(r, { serial: nextSerial(rows), date: m + '-01', txType: 'fee', direction: 'out', amount: feeFor(m), description: 'עמלת ניהול חשבון חודשית', auto: true, feeMonth: m });
      rows.push(r); bf.generated[m] = r.id; created++;
    }
    m = monthAdd(m, 1);
  }
  return created;
}

  { key: 'txDate', label: 'תאריך עסקה', kw: ['תאריך עסקה', 'תאריך רכישה', 'תאריך העסקה', 'תאריך'] },
